name: Wandoujia
description: 'Wandoujia (豌豆荚, "pea pod") is a Chinese Android app distribution platform and mobile
  assistant launched in 2009 by Beijing-based Wandoulabs (Zhuoyi Xunchang Technology). It was known
  for its PC-based Android management client and its in-app content search that indexed apps, games,
  video, and other content across the Chinese Android ecosystem. Wandoujia was acquired by Alibaba/UCWeb
  in 2016 and folded into Alibaba''s app-distribution business. Its consumer and developer web
  properties (www., open., and developer.wandoujia.com) no longer resolve; only residual
  Alibaba-hosted infrastructure (api. and account.wandoujia.com) remains, and there is no documented
  public API surface.'
